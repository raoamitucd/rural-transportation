<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Transport Research Database - Map Dashboard</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f7f7f7; 
            color: #1a1a1a; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header { 
            padding: 16px 24px; 
            background: #ffffff;
            border-bottom: 1px solid #dddddd; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0 0 4px 0; font-size: 20px; font-weight: 600; }
        p { margin: 0; color: #666; font-size: 13px; }
        
        nav { display: flex; gap: 10px; }
        .nav-btn {
            text-decoration: none;
            background: #0d1117;
            color: #58a6ff;
            border: 1px solid #30363d;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
        }
        .nav-btn:hover { background: #161b22; color: #79c0ff; }
        .nav-btn.active { background: #1f6feb; color: #ffffff; border-color: #1f6feb; }

        #dashboard-container { 
            flex: 1;
            padding: 20px; 
            box-sizing: border-box;
        }
        #map-container { 
            width: 100%; 
            height: 100%; 
            border: 1px solid #dddddd; 
            border-radius: 6px; 
            background: #f0f0f0; 
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>Investigating Strategies to Enhance Access to Public Transportation in Rural Ireland</h1>
        <p>Interactive spatiotemporal repository for literature review.</p>
    </div>
    <nav>
        <a href="inventory.html" class="nav-btn">📋 Database Inventory</a>
    </nav>
</header>

<div id="dashboard-container">
    <div id="map-container"></div>
</div>

<script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSemWY3KZtKhpi91drdaoWp6dnapnQqbWuztti-kjxVDnW9zlya8vvRGxWTaoGUMs6rr5hVMosohi7s/pub?output=csv';

    let map;
    let markerLayerGroup;

    // 1. Initialize Leaflet Map
    function initMap() {
        const worldBounds = L.latLngBounds([-90, -180], [90, 180]);

        map = L.map('map-container', {
            maxBounds: worldBounds,        
            maxBoundsViscosity: 1.0,         
            minZoom: 2,                      
            maxZoom: 14
        }).setView([53.4129, -8.2439], 6);

        // Free Esri Light Gray Canvas layer (Monochromatic, no API key required)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
            maxZoom: 16,
            noWrap: true,                    
            bounds: worldBounds            
        }).addTo(map);

        markerLayerGroup = L.layerGroup().addTo(map);
    }

    initMap();

    // 2. Fetch Google Sheet CSV and plot paper markers on map
    Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
            plotMarkers(results.data);
        },
        error: function(err) {
            console.error("Failed to fetch sheet dataset: ", err);
        }
    });

    function plotMarkers(data) {
        markerLayerGroup.clearLayers();

        data.forEach(p => {
            if (p.Lat && p.Long) {
                const lat = parseFloat(p.Lat);
                const lng = parseFloat(p.Long);
                const paperId = (p['Paper_ID'] || p['paper_id'] || '').trim();

                if (!isNaN(lat) && !isNaN(lng)) {
                    const marker = L.marker([lat, lng])
                        .bindPopup(`
                            <div style="font-family: sans-serif; font-size:12px; line-height:1.5;">
                                <b style="font-size:13px;">${p.Title || 'Untitled'}</b><br>
                                <span style="color:#666;">${p['City, Country'] || 'N/A'} (${p['Year'] || 'N/A'})</span><br><br>
                                <a href="inventory.html?paperId=${encodeURIComponent(paperId)}" style="color:#0969da; font-weight:600;">View in Inventory →</a>
                            </div>
                        `);
                    
                    markerLayerGroup.addLayer(marker);
                }
            }
        });
    }
</script>

</body>
</html>
